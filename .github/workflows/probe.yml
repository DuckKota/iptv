name: Schedule Probe

# TEMPORARY. Proves whether `schedule` events are delivered to this repository
# at all. Does nothing but print the time, so a probe costs a few seconds.
# Delete this file once the real schedules are confirmed working.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "schedule event: ${{ github.event_name }}"
          echo "cron that fired: ${{ github.event.schedule }}"
          date -u
